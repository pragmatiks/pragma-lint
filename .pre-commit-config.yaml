default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: check-comments
        name: Enforce NO COMMENTS policy
        entry: uv run --frozen --project python python -m pragmatiks_lint.comments
        language: system
        types: [python]
        exclude: ^python/tests/fixtures/
      - id: check-sources
        name: Reject non-registry dependency sources
        entry: uv run --frozen --project python python -m pragmatiks_lint.sources
        language: system
        files: (^|/)(pyproject\.toml|package\.json|pnpm-workspace\.yaml)$
      - id: check-uv-pip
        name: Reject uv pip in tracked files
        entry: uv run --frozen --project python python -m pragmatiks_lint.uv_pip
        language: system
        exclude: ^python/tests/
