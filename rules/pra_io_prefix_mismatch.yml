rules:
  - id: pra-io-prefix-mismatch
    patterns:
      - pattern-either:
          - pattern: |
              def $NAME(...):
                  ...
          - pattern: |
              async def $NAME(...):
                  ...
      - metavariable-regex:
          metavariable: $NAME
          regex: '^(get|fetch|retrieve|load|save|read|write|query)_.*'
      - pattern-not: |
          def $NAME(...):
              ...
              await $CALL
              ...
      - pattern-not: |
          async def $NAME(...):
              ...
              await $CALL
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              open(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              httpx.$METHOD(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              requests.$METHOD(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              $PATH.read_text(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              $PATH.read_bytes(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              $PATH.write_text(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              $PATH.write_bytes(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              $PATH.unlink(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              $PATH.mkdir(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              $PATH.exists(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              $PATH.iterdir(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              $PATH.glob(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              $PATH.rmdir(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              shutil.$METHOD(...)
              ...
      - pattern-not: |
          def $NAME(...):
              ...
              subprocess.$METHOD(...)
              ...
      - pattern-not-regex: '(?s)\bos\.(mkdir|makedirs|rmdir|removedirs|remove|unlink|rename|replace|kill|chdir|chmod|chown|symlink|link|stat|lstat|listdir|scandir|access|system|popen|path\.(exists|isfile|isdir|islink|getsize))\('
      - pattern-not-regex: '(?s)(database|session|connection|cursor|client)\.(execute|fetch|get|post|put|delete|query|read|write|save)\('
    message: "principle #7 I/O-prefixed function appears pure. Rename it with compute, build, derive, format, or parse."
    severity: WARNING
    languages: [python]
    metadata:
      note: "Heuristic rule; false positives are expected for hidden I/O wrappers."
