name: Publish JS

concurrency:
  group: pragma-lint-release
  cancel-in-progress: false
  queue: max

on:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "rules/**"
      - ".github/workflows/publish-js.yaml"
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      version: ${{ steps.bump.outputs.version || steps.unreleased.outputs.version }}
      unreleased-sha: ${{ steps.unreleased.outputs.sha }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.17
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: false
      - name: Configure git
        run: |
          git config user.name "pragma-ci-bot[bot]"
          git config user.email "254457222+pragma-ci-bot[bot]@users.noreply.github.com"
      - name: Record base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Bump version
        id: bump
        working-directory: js
        run: |
          set +e
          cz bump --yes --changelog
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 21 ] || [ "$EXIT_CODE" -eq 3 ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            NEW_VERSION=$(cz version --project)
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          else
            exit "$EXIT_CODE"
          fi
      - name: Find unfinished release
        id: unreleased
        if: steps.bump.outputs.bumped == 'false'
        working-directory: js
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: js-v
        run: |
          version=$(cz version --project)
          tag="${TAG_PREFIX}${version}"
          if ! sha=$(git rev-parse --quiet --verify "refs/tags/${tag}^{commit}"); then
            echo "::notice::No tag ${tag}; nothing to release"
            exit 0
          fi
          release_draft=$(gh api graphql \
            -f query="query(\$owner: String!, \$name: String!, \$tag: String!) { repository(owner: \$owner, name: \$name) { release(tagName: \$tag) { isDraft } } }" \
            -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f tag="$tag" \
            --jq .data.repository.release.isDraft)
          if [ -n "$release_draft" ]; then
            exit 0
          fi
          echo "::notice::${tag} has no GitHub Release; completing its release at ${sha}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: Bundle bump commit and tag
        if: steps.bump.outputs.bumped == 'true'
        env:
          TAG: js-v${{ steps.bump.outputs.version }}
        run: git bundle create "$RUNNER_TEMP/release.bundle" "refs/tags/$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.bump.outputs.bumped == 'true'
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 1

  push:
    needs: bump
    if: needs.bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle
      - name: Mint release bot token
        id: release-bot-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: write
      - name: Push bump commit and tag
        id: push
        env:
          RELEASE_BOT_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          VERSION: ${{ needs.bump.outputs.version }}
          BASE: ${{ needs.bump.outputs.base }}
          WORKFLOW_FILE: publish-js.yaml
          TAG_PREFIX: js-v
          ALLOWED_PATHS: js/.cz.toml js/CHANGELOG.md js/package.json
        run: |
          set -eu
          if ! printf '%s' "$VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Invalid version '${VERSION}'"
            exit 1
          fi
          tag="${TAG_PREFIX}${VERSION}"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"

          git init --quiet "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          git fetch --quiet "$RUNNER_TEMP/bundle/release.bundle" "refs/tags/${tag}:refs/tags/${tag}"
          sha=$(git rev-parse "refs/tags/${tag}^{commit}")
          if [ "$(git rev-parse "${sha}^")" != "$BASE" ]; then
            echo "::error::${tag} is not a single commit on top of ${BASE}"
            exit 1
          fi
          for path in $(git diff --name-only "$BASE" "$sha"); do
            case " ${ALLOWED_PATHS} " in
              *" ${path} "*) ;;
              *) echo "::error::Bump commit touches unexpected path ${path}"; exit 1 ;;
            esac
          done

          authorization=$(printf 'x-access-token:%s' "$RELEASE_BOT_TOKEN" | base64 -w0)
          echo "::add-mask::${authorization}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${authorization}"

          if git push --atomic "$remote" "${sha}:refs/heads/main" "refs/tags/${tag}"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "sha=${sha}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote_line=$(git ls-remote "$remote" refs/heads/main)
          remote_main=$(printf '%s' "$remote_line" | cut -f1)
          if [ -z "$remote_main" ] || [ "$remote_main" = "$BASE" ]; then
            echo "::error::Push of ${tag} rejected while main is still at ${BASE}; see git's error above"
            exit 1
          fi
          GH_TOKEN="$RELEASE_BOT_TOKEN" gh workflow run "$WORKFLOW_FILE" --repo "$GITHUB_REPOSITORY" --ref main
          echo "::notice::main moved from ${BASE} to ${remote_main} during this run, so ${tag} was not released. Dispatched a new Publish JS run on main, which bumps from the latest main."
          echo "pushed=false" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: [bump, push]
    if: ${{ !cancelled() && needs.bump.result == 'success' && (needs.push.outputs.pushed == 'true' || needs.bump.outputs.unreleased-sha != '') }}
    runs-on: ubuntu-latest
    environment: npmjs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.push.outputs.sha || needs.bump.outputs.unreleased-sha }}
          persist-credentials: false
      - name: Verify tag points at the pushed commit
        env:
          TAG: js-v${{ needs.bump.outputs.version }}
          SHA: ${{ needs.push.outputs.sha || needs.bump.outputs.unreleased-sha }}
        run: |
          git fetch --quiet --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" != "$SHA" ]; then
            echo "::error::${TAG} does not point at the pushed commit ${SHA}"
            exit 1
          fi
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.17
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: false
      - name: Build
        working-directory: js
        run: |
          pnpm install --frozen-lockfile
          task build
      - name: Publish to npm
        working-directory: js
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          published=$(npm view "@pragmatiks/lint@${VERSION}" version 2> /dev/null || true)
          if [ "$published" = "$VERSION" ]; then
            echo "::notice::@pragmatiks/lint@${VERSION} is already on npm"
            exit 0
          fi
          npm publish --access public --provenance

  github-release:
    needs: [bump, publish-npm]
    if: ${{ !cancelled() && needs.publish-npm.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          tag="js-v${VERSION}"
          release_draft=$(gh api graphql \
            -f query="query(\$owner: String!, \$name: String!, \$tag: String!) { repository(owner: \$owner, name: \$name) { release(tagName: \$tag) { isDraft } } }" \
            -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f tag="$tag" \
            --jq .data.repository.release.isDraft)
          if [ -n "$release_draft" ]; then
            echo "::notice::Release ${tag} already exists"
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "@pragmatiks/lint v${VERSION}" --generate-notes
