version: "3"

tasks:
  install:
    desc: Install JS dependencies
    cmd: pnpm install

  vendor-rules:
    desc: Vendor shared semgrep rules into the npm package
    cmds:
      - rm -rf src/semgrep-rules
      - mkdir -p src/semgrep-rules
      - cp ../rules/*.yml src/semgrep-rules/

  format:
    desc: Format TypeScript code
    cmd: pnpm format

  check:
    desc: Lint and type check
    deps:
      - vendor-rules
    cmd: pnpm check

  test:
    desc: Run JS tests
    deps:
      - vendor-rules
    cmd: pnpm test

  build:
    desc: Build distribution
    deps:
      - vendor-rules
    cmd: pnpm build

  pack:
    desc: Install, build and npm pack the committed HEAD as CI publishes it, with the mise-locked node, pnpm and npm, in a throwaway worktree, leaving this checkout's node_modules untouched
    vars:
      PACK_ROOT:
        sh: mktemp -d
      CHECKOUT: "{{.PACK_ROOT}}/checkout"
    cmds:
      - defer: git worktree remove --force "{{.CHECKOUT}}"; rm -rf "{{.PACK_ROOT}}"
      - git worktree add --detach "{{.CHECKOUT}}" HEAD
      - node -v
      - pnpm -v
      - npm -v
      - pnpm --dir "{{.CHECKOUT}}/js" install --frozen-lockfile
      - task --dir "{{.CHECKOUT}}/js" build
      - npm pack "{{.CHECKOUT}}/js" --pack-destination "{{.TASKFILE_DIR}}"

  publish:
    desc: Publish to npm registry
    cmd: pnpm publish --access public
