version: "3"

tasks:
  install:
    desc: Install JS dependencies
    cmd: pnpm install

  vendor-rules:
    desc: Vendor shared semgrep rules into the npm package
    cmds:
      - rm -rf src/semgrep-rules
      - mkdir -p src/semgrep-rules
      - cp ../rules/*.yml src/semgrep-rules/

  format:
    desc: Format TypeScript code
    cmd: pnpm format

  check:
    desc: Lint and type check
    deps:
      - vendor-rules
    cmd: pnpm check

  test:
    desc: Run JS tests
    deps:
      - vendor-rules
    cmd: pnpm test

  build:
    desc: Build distribution
    deps:
      - vendor-rules
    cmd: pnpm build

  pack:
    desc: Pack the committed HEAD with CI's toolchain (Node 26, pnpm 12.6.0, latest npm) in a throwaway worktree, leaving this checkout's node_modules untouched
    vars:
      CI_TOOLCHAIN: mise exec node@26 pnpm@12.6.0 --
      PACK_ROOT:
        sh: mktemp -d
      CHECKOUT: "{{.PACK_ROOT}}/checkout"
    cmds:
      - defer: git worktree remove --force "{{.CHECKOUT}}"; rm -rf "{{.PACK_ROOT}}"
      - git worktree add --detach "{{.CHECKOUT}}" HEAD
      - "{{.CI_TOOLCHAIN}} node -v"
      - "{{.CI_TOOLCHAIN}} pnpm -v"
      - '{{.CI_TOOLCHAIN}} pnpm --dir "{{.CHECKOUT}}/js" install --frozen-lockfile'
      - '{{.CI_TOOLCHAIN}} task --dir "{{.CHECKOUT}}/js" build'
      - '{{.CI_TOOLCHAIN}} npx --yes --package npm@latest --call ''npm -v && npm pack "{{.CHECKOUT}}/js" --pack-destination "{{.TASKFILE_DIR}}"'''

  publish:
    desc: Publish to npm registry
    cmd: pnpm publish --access public
